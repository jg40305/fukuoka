  "大分縣日出町": "#80df1f",       // 螢光綠（Lat 33.36）

  // === 佐賀縣 ===
  "佐賀縣吉野里/神埼市": "#ca8a04", // 遺址金（Lat ~33.32）
  "佐賀縣神埼市": "#d97706",       // 苔庭橙（Lat ~33.32）
  "佐賀縣鳥栖市": "#eab308",       // 陽光黃（Lat ~33.40）
  "佐賀縣佐賀市": "#f59e0b",       // 城下黃（Lat ~33.25）
  "佐賀縣武雄市": "#f97316",       // 樓門橙（Lat ~33.19）

  // === 長崎縣 ===
  "長崎縣佐世保市": "#8257e5",     // 港灣紫（Lat ~33.09）
  "長崎縣長崎市": "#9333ea",       // 異國紫（Lat ~32.75）

  // === 熊本縣（阿蘇與火之國） ===
  "熊本縣阿蘇郡南小國町": "#f97316", // 黑川紅（Lat ~33.08）
  "熊本縣阿蘇市": "#ef4444",       // 火山紅（Lat ~32.88）
  "熊本縣熊本市": "#dc2626",       // 熊本紅（Lat ~32.80）

  // === 宮崎縣（最南區） ===
  "宮崎縣西臼杵郡高千穗町": "#c026d3" // 神話紫（Lat ~32.70）[最南]
};

const map = L.map('map').setView([33.35, 130.8], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let boundariesData = {};
let currentBoundaryLayer = null;
let currentActiveGroupName = null;
const groupElements = {};
const groupMarkerLayers = {};

function highlightDistrictBoundary(groupName, color) {
  // 如果再次點選同一個行政區，則取消選取並移除邊界
  if (currentActiveGroupName === groupName) {
    if (currentBoundaryLayer) {
      map.removeLayer(currentBoundaryLayer);
      currentBoundaryLayer = null;
    }
    if (groupElements[groupName]) {
      groupElements[groupName].classList.remove('active');
    }
    currentActiveGroupName = null;
    return;
  }

  // 清除舊的選取狀態與圖層
  if (currentActiveGroupName && groupElements[currentActiveGroupName]) {
    groupElements[currentActiveGroupName].classList.remove('active');
  }
  if (currentBoundaryLayer) {
    map.removeLayer(currentBoundaryLayer);
    currentBoundaryLayer = null;
  }

  // 設定當前選中行政區
  currentActiveGroupName = groupName;
  if (groupElements[groupName]) {
    groupElements[groupName].classList.add('active');
  }

  const geojson = boundariesData[groupName];
  if (geojson && geojson.features && geojson.features.length > 0) {
    currentBoundaryLayer = L.geoJSON(geojson, {
      style: {
        color: color || '#1d4ed8',
        weight: 3.5,
        opacity: 0.95,
        fillColor: color || '#1d4ed8',
        fillOpacity: 0.18,
        dashArray: '5, 5'
      },
      onEachFeature: (feature, layer) => {
        const title = `${groupName}`;
        layer.bindTooltip(title, { sticky: true, className: 'boundary-tooltip' });
      }
    }).addTo(map);

    try {
      const bounds = currentBoundaryLayer.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    } catch (e) {
      console.warn('fitBounds error:', e);
    }
  } else if (groupMarkerLayers[groupName] && groupMarkerLayers[groupName].length > 0) {
    // 若無邊界資料，則根據景點標記範圍定位
    const groupCoords = groupMarkerLayers[groupName].map(item => [item.data.lat, item.data.lng]);
    const bounds = L.latLngBounds(groupCoords);
    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
  }
}

function renderData(dataArr) {
  const groups = {};

  dataArr.forEach(d => {
    const color = groupColors[d.group] || "#333";
    const marker = L.circleMarker([d.lat, d.lng], {
      radius: 7,
      fillColor: color,
      color: "#fff",
      weight: 1.5,
      fillOpacity: 0.9
    }).addTo(map);

    const gmapsUrl = d.google_maps_url || `https://www.google.com/maps/search/?api=1&query=${d.lat},${d.lng}`;
    const popupHtml = `<b>${d.name}</b><br>分類：${d.group}<br>座標：${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}` +
      (d.note ? `<br><span style="color:#999">備註：${d.note}</span>` : "") +
      `<br><a href="${gmapsUrl}" target="_blank" rel="noopener">在 Google 地圖開啟 →</a>`;
    marker.bindPopup(popupHtml);

    if (!groups[d.group]) groups[d.group] = [];
    groups[d.group].push({ marker, data: d });
  });

  // build sidebar
  const groupsEl = document.getElementById('groups');
  groupsEl.innerHTML = '';
  Object.keys(groupColors).forEach(groupName => {
    if (!groups[groupName]) return;
    const color = groupColors[groupName];
    groupMarkerLayers[groupName] = groups[groupName];

    const groupDiv = document.createElement('div');
    groupDiv.className = 'group';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'group-title';
    titleDiv.style.background = color;
    titleDiv.title = `點選圈出 ${groupName} 行政區邊界`;
    titleDiv.innerHTML = `<span>${groupName}</span><span class="badge">${groups[groupName].length}</span>`;
    
    titleDiv.onclick = () => {
      highlightDistrictBoundary(groupName, color);
    };

    groupElements[groupName] = titleDiv;
    groupDiv.appendChild(titleDiv);

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'group-items';

    groups[groupName].forEach(entry => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'item';
      itemDiv.textContent = entry.data.name;
      itemDiv.onclick = () => {
        map.setView([entry.data.lat, entry.data.lng], 13);
        entry.marker.openPopup();
      };
      itemsDiv.appendChild(itemDiv);
    });

    groupDiv.appendChild(itemsDiv);
    groupsEl.appendChild(groupDiv);
  });
}

// 載入行政區邊界 GeoJSON 資料
fetch('assets/boundaries.json')
  .then(res => res.ok ? res.json() : {})
  .then(data => {
    boundariesData = data;
  })
  .catch(err => {
    console.warn('讀取 assets/boundaries.json 失敗:', err);
  });

// 優先讀 assets/reference_data.json；若直接用 file:// 開啟導致 fetch 失敗，退回用內建的 fallbackData
fetch('assets/reference_data.json')
  .then(res => {
    if (!res.ok) throw new Error('fetch failed');
    return res.json();
  })
  .then(json => renderData(json))
  .catch(() => {
    console.warn('讀取 assets/reference_data.json 失敗，改用內建備用資料。若是用 file:// 直接開啟本檔案，瀏覽器會擋 fetch，建議改用本機伺服器或直接看 GitHub Pages 上的版本。');
    renderData(fallbackData);
  });
</script>
